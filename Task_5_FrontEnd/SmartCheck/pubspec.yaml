name: smartcheck
description: "Mobile-Based Attendance Management System Based on Geofencing and Facial Recognition"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  provider: ^6.1.1

  cloud_firestore: ^5.6.9

  # Maps & Location
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^10.1.0
  
  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  
  # HTTP & Networking
  http: ^1.1.0
  
  # File & Document handling
  path_provider: ^2.1.1
  pdf: ^3.10.7
  excel: ^2.1.0
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  
  # Utilities
  intl: ^0.18.1
  fl_chart: ^1.0.0
  file_picker: ^10.2.0
  permission_handler: ^12.0.0+1
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
 #   - assets/icons/
  
